  <title>我的课程 · Bin哥的知识地图</title>
  <style>
    :root { color-scheme: light dark; --bg:#faf8f5; --surface:#fffdf9; --text:#2c2825; --muted:#746d64; --border:#d4cfc7; --accent:#d97757; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171615; --surface:#2c2926; --text:#f4efe8; --muted:#b8afa4; --border:#49433d; --accent:#e79678; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--accent) 8%,var(--bg))); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:72px 0; }
    .back { display:inline-flex; color:var(--muted); text-decoration:none; margin-bottom:42px; }
    .back:hover { color:var(--accent); }
    .eyebrow { margin:0 0 10px; color:var(--accent); font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(38px,7vw,64px)/1.1 Georgia,"Songti SC",serif; }
    .intro { max-width:640px; margin:18px 0 38px; color:var(--muted); font-size:18px; }
    .course { display:block; padding:28px; color:inherit; text-decoration:none; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 16px 45px rgba(44,40,37,.09); }
    .course:hover { border-color:var(--accent); transform:translateY(-2px); }
    .course-type { color:var(--accent); font-size:14px; font-weight:700; }
    h2 { margin:8px 0 10px; font-size:clamp(24px,4vw,34px); line-height:1.2; }
    .course p { margin:0; color:var(--muted); }
    .open { display:block; margin-top:22px; color:var(--accent); font-weight:700; }
  </style>
</head>
